# =============================================================================
# Battery + market configuration for the BESS dispatch optimizer.
# No magic numbers live in the code -- every physical / economic assumption
# is here so it can be changed and defended without touching the model.
# Defaults describe a typical German grid-scale 2-hour lithium (LFP) system.
# =============================================================================

battery:
  power_mw: 10.0            # max charge / discharge power (grid connection)
  energy_mwh: 20.0          # nameplate usable energy (2-hour duration)
  round_trip_efficiency: 0.86   # AC-AC RTE. Split as sqrt() across ch/dis:
                                # eta_ch = eta_dis = sqrt(0.86) ~= 0.9274
  soc_min_frac: 0.05        # keep >= 5% of nameplate (protect the cells)
  soc_max_frac: 0.95        # keep <= 95% of nameplate
  soc_init_frac: 0.50       # state of charge at t=0 (fraction of nameplate)
  max_cycles_per_day: 1.5   # equivalent full cycles/day (warranty-typical)

# Marginal cost of throughput from cyclic ageing. We DERIVE it, we don't guess:
#
#   c_deg [EUR/MWh discharged] = replacement_cost_per_kWh * 1000
#                                / (cycle_life * depth_of_discharge)
#
# Interpretation: a battery cell costs `replacement_cost_per_kWh` and survives
# `cycle_life` cycles at `depth_of_discharge` depth before end-of-life. Every
# MWh you push through it consumes a slice of that finite lifetime; c_deg prices
# that slice. It is the arbitrage hurdle -- a trade must beat it to be worth the
# wear. With the defaults below, c_deg ~= 16.7 EUR/MWh.
#
# NOTE: battery costs are falling fast. These are conservative 2024-ish LFP
# assumptions; cite your own source in the README and update before quoting.
degradation:
  replacement_cost_eur_per_kwh: 120.0   # pack-level replacement cost, EUR/kWh
  cycle_life_cycles: 8000               # cycles to 80% state-of-health (LFP)
  depth_of_discharge: 0.90              # depth the cycle_life rating assumes

market:
  timezone: "Europe/Berlin"
  delta_t_hours: 1.0        # market/settlement resolution (hourly day-ahead)
  # SMARD.de series IDs (German regulator, free, no API key). See src/bess/data.
  # IDs were validated by correlating each day-ahead forecast against SMARD's
  # realised-generation series over June 2024 (corr in brackets) -- see the
  # README "Data provenance" note. Do not trust folklore ID lists; verify.
  smard_region: "DE"
  smard_series:
    price_day_ahead: 4169   # EUR/MWh, DE/LU day-ahead wholesale price
    load_forecast: 411      # MW, day-ahead load (Netzlast) forecast   (r=0.98)
    solar_forecast: 125     # MW, day-ahead photovoltaic forecast      (r=0.99)
    wind_onshore_forecast: 123    # MW, day-ahead onshore wind forecast  (r=0.96)
    wind_offshore_forecast: 3791  # MW, day-ahead offshore wind forecast (r=0.81)

economics:
  capex_eur_per_kwh: 250.0  # all-in installed capex, EUR/kWh, for payback calc
