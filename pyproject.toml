[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bess-dispatch-optimizer"
version = "0.1.0"
description = "Day-ahead dispatch optimizer for a grid-scale battery in the German market"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohammad Faisal", email = "mohammad.faisal@gmx.de" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.28",
    "pyyaml>=6.0",
    "pulp>=2.7,<4",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.urls]
Repository = "https://github.com/CodingxFaisal/bess-dispatch-optimizer"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    # PuLP 3.x pre-announces 4.0 API changes for the (currently standard) CBC
    # solver and LpVariable constructor. We pin pulp<4; silence the noise.
    "ignore:PULP_CBC_CMD is deprecated:DeprecationWarning",
    "ignore:Constructing LpVariable:DeprecationWarning",
]
