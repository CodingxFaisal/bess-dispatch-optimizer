[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridflex"
version = "0.2.0.dev0"
description = "Battery storage dispatch optimisation and day-ahead market research for the German (DE-LU) bidding zone"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Mohammad Faisal", email = "mohammad.faisal@gmx.de" }]
# Lower bounds document the API levels the code relies on; exact versions are
# pinned in uv.lock (and mirrored in requirements*.txt for pip users).
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "requests>=2.32",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pulp>=2.8,<4",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "highspy>=1.7",
    "streamlit>=1.57",
    "plotly>=5.20",
]

[project.urls]
Repository = "https://github.com/CodingxFaisal/bess-dispatch-optimizer"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridflex = ["py.typed"]

# --------------------------------------------------------------------------- #
# Tests
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: test needs live access to smard.de (deselected by default; run with -m network)",
]
filterwarnings = [
    # PuLP 3.x pre-announces 4.0 API changes for the CBC solver and the
    # LpVariable constructor. The legacy optimiser is replaced in Stage 4.
    "ignore:PULP_CBC_CMD is deprecated:DeprecationWarning",
    "ignore:Constructing LpVariable:DeprecationWarning",
]

[tool.coverage.run]
source = ["gridflex"]

# --------------------------------------------------------------------------- #
# Lint / format / types
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # unicode symbols (η, −, ×) are intentional in docs/comments
]

[tool.ruff.lint.isort]
known-first-party = ["gridflex", "_common", "tests_helpers", "ui_common"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["gridflex"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# New, contract-bearing modules are type-checked strictly. The legacy
# optimiser / forecast / backtest modules are rewritten in Stages 3-6 and are
# held to the default (non-strict) level until then.
[[tool.mypy.overrides]]
module = [
    "gridflex.config.*", "gridflex.data.*", "gridflex.battery.*",
    "gridflex.optimization.*", "gridflex.forecasting.*", "gridflex.settlement.*",
    "gridflex.backtest.*", "gridflex.reporting.*", "gridflex.finance.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
